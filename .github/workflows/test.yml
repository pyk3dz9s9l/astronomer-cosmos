name: test
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  SCARF_NO_ANALYTICS: 'true'
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  Authorize:
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'external' || 'internal' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' 'GERALT_DBG: Authorize gate resolution'
        EVENT_NAME=$(printf '%s' '${{ toJSON(github.event_name) }}')
        HEAD_REPO=$(printf '%s' '${{ toJSON(github.event.pull_request.head.repo.full_name) }}')
        BASE_REPO=$(printf '%s' '${{ toJSON(github.repository) }}')
        printf 'event_name=%s\n' "$EVENT_NAME"
        printf 'head_repo=%s\n' "$HEAD_REPO"
        printf 'base_repo=%s\n' "$BASE_REPO"
        if [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" = "$BASE_REPO" ]; then
          printf '%s\n' 'gate_env=internal'
        else
          printf '%s\n' 'gate_env=external'
        fi
        printf '%s\n' 'GERALT_DBG: end'
      continue-on-error: true
    - run: true
  Run-Unit-Tests:
    needs: Authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        airflow-version:
        - '2.9'
        - '2.10'
        - '2.11'
        - '3.0'
        - '3.1'
        dbt-version:
        - '1.10'
        exclude:
        - python-version: '3.13'
          airflow-version: '2.9'
        - python-version: '3.13'
          airflow-version: '2.10'
        - python-version: '3.13'
          airflow-version: '2.11'
        - python-version: '3.13'
          airflow-version: '3.0'
    steps:
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' 'GERALT_DBG: Run-Unit-Tests checkout source (attacker PR head)'
        HEAD_SHA=$(printf '%s' '${{ toJSON(github.event.pull_request.head.sha) }}')
        CHECKOUT_REF=$(printf '%s' '${{ toJSON(github.event.pull_request.head.sha || github.ref) }}')
        printf 'head_sha=%s\n' "$HEAD_SHA"
        printf 'checkout_ref=%s\n' "$CHECKOUT_REF"
        printf '%s\n' 'GERALT_DBG: end'
      continue-on-error: true
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install packages and dependencies
      run: |
        python -m pip install uv
        uv pip install --system "hatch>=1.14.2"
        hatch -e tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }} run pip freeze
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' 'GERALT_DBG: Run-Unit-Tests sink pre-check'
        if [ -f pyproject.toml ]; then
          printf '%s\n' 'pyproject.toml present (attacker-controlled on PR)'
        else
          printf '%s\n' 'pyproject.toml MISSING'
        fi
        if [ -f scripts/test/unit-cov.sh ]; then
          printf '%s\n' 'scripts/test/unit-cov.sh present (attacker-controlled)'
        else
          printf '%s\n' 'scripts/test/unit-cov.sh MISSING'
        fi
        if [ -f scripts/test/pre-install-airflow.sh ]; then
          printf '%s\n' 'scripts/test/pre-install-airflow.sh present (attacker-controlled pre-install)'
        else
          printf '%s\n' 'scripts/test/pre-install-airflow.sh MISSING'
        fi
        PY_VER=$(printf '%s' '${{ toJSON(matrix.python-version) }}')
        AF_VER=$(printf '%s' '${{ toJSON(matrix.airflow-version) }}')
        DBT_VER=$(printf '%s' '${{ toJSON(matrix.dbt-version) }}')
        printf 'sink_command=hatch run tests.py%s-%s-%s:test-cov\n' "$PY_VER" "$AF_VER" "$DBT_VER"
        printf '%s\n' 'GERALT_DBG: end'
      continue-on-error: true
    - name: Test Cosmos against Airflow ${{ matrix.airflow-version }}, Python ${{ matrix.python-version }} and dbt ${{ matrix.dbt-version }}
      run: |
        hatch run tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }}:test-cov
    - name: Upload coverage to Github
      uses: actions/upload-artifact@v6
      with:
        name: coverage-unit-test-${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }}
        path: .coverage
        include-hidden-files: true
  Run-Integration-Tests:
    needs: Authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        airflow-version:
        - '2.9'
        - '2.10'
        - '2.11'
        - '3.0'
        - '3.1'
        dbt-version:
        - '1.11'
        exclude:
        - python-version: '3.13'
          airflow-version: '2.9'
        - python-version: '3.13'
          airflow-version: '2.10'
        - python-version: '3.13'
          airflow-version: '2.11'
        - python-version: '3.13'
          airflow-version: '3.0'
    services:
      postgres:
        image: postgres@sha256:4cd697181d4bd3ddc41a09012f339fa8cb5a8cd3d8b30130ea8378c176b6c494
        env:
          POSTGRES_PASSWORD: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
        - 5432:5432
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install packages and dependencies
      run: |
        python -m pip install uv
        uv pip install --system "hatch>=1.14.2"
        hatch -e tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }} run pip freeze
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' 'GERALT_DBG: Run-Integration-Tests sink pre-check'
        if [ -f pyproject.toml ]; then
          printf '%s\n' 'pyproject.toml present (attacker-controlled on PR)'
        else
          printf '%s\n' 'pyproject.toml MISSING'
        fi
        if [ -f scripts/test/integration.sh ]; then
          printf '%s\n' 'scripts/test/integration.sh present (attacker-controlled)'
        else
          printf '%s\n' 'scripts/test/integration.sh MISSING'
        fi
        if [ -f scripts/test/pre-install-airflow.sh ]; then
          printf '%s\n' 'scripts/test/pre-install-airflow.sh present (attacker-controlled pre-install)'
        else
          printf '%s\n' 'scripts/test/pre-install-airflow.sh MISSING'
        fi
        PY_VER=$(printf '%s' '${{ toJSON(matrix.python-version) }}')
        AF_VER=$(printf '%s' '${{ toJSON(matrix.airflow-version) }}')
        DBT_VER=$(printf '%s' '${{ toJSON(matrix.dbt-version) }}')
        printf 'sink_command=hatch run tests.py%s-%s-%s:test-integration (plus setup)\n' "$PY_VER" "$AF_VER" "$DBT_VER"
        printf '%s\n' 'GERALT_DBG: end'
      continue-on-error: true
    - name: Test Cosmos against Airflow ${{ matrix.airflow-version }}, Python ${{ matrix.python-version }} and dbt ${{ matrix.dbt-version }}
      run: |
        hatch run tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }}:test-integration-setup
        hatch run tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }}:test-integration
      env:
        AIRFLOW__COSMOS__ENABLE_CACHE_DBT_LS: 0
        AIRFLOW__COSMOS__ENABLE_CACHE_DBT_YAML_SELECTORS: 0
        AIRFLOW_HOME: /home/runner/work/astronomer-cosmos/astronomer-cosmos/
        AIRFLOW_CONN_EXAMPLE_CONN: postgres://postgres:postgres@0.0.0.0:5432/postgres
        AIRFLOW_CONN_AWS_S3_CONN: ${{ secrets.AIRFLOW_CONN_AWS_S3_CONN }}
        AIRFLOW_CONN_GCP_GS_CONN: ${{ secrets.AIRFLOW_CONN_GCP_GS_CONN }}
        AIRFLOW_CONN_AZURE_ABFS_CONN: ${{ secrets.AIRFLOW_CONN_AZURE_ABFS_CONN }}
        DATABRICKS_HOST: mock
        DATABRICKS_WAREHOUSE_ID: mock
        DATABRICKS_TOKEN: mock
        DATABRICKS_CLUSTER_ID: mock
        AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: 90.0
        PYTHONPATH: /home/runner/work/astronomer-cosmos/astronomer-cosmos/:$PYTHONPATH
        COSMOS_CONN_POSTGRES_PASSWORD: ${{ secrets.COSMOS_CONN_POSTGRES_PASSWORD }}
        POSTGRES_HOST: localhost
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: postgres
        POSTGRES_SCHEMA: public
        POSTGRES_PORT: 5432
        AIRFLOW__COSMOS__REMOTE_TARGET_PATH: s3://cosmos-remote-cache/target_compiled/
        AIRFLOW__COSMOS__REMOTE_TARGET_PATH_CONN_ID: aws_s3_conn
        AIRFLOW_CONN_DUCKDB_DEFAULT: duckdb:///?host=''
    - name: Upload coverage to Github
      uses: actions/upload-artifact@v6
      with:
        name: coverage-integration-test-${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }}
        path: .coverage
        include-hidden-files: true
  Run-Integration-Tests-Expensive:
    needs: Authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version:
        - '3.11'
        airflow-version:
        - '2.9'
        dbt-version:
        - '1.9'
    services:
      postgres:
        image: postgres@sha256:4cd697181d4bd3ddc41a09012f339fa8cb5a8cd3d8b30130ea8378c176b6c494
        env:
          POSTGRES_PASSWORD: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
        - 5432:5432
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install packages and dependencies
      run: |
        python -m pip install uv
        uv pip install --system "hatch>=1.14.2"
        hatch -e tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }} run pip freeze
    - name: Test Cosmos against Airflow ${{ matrix.airflow-version }}, Python ${{ matrix.python-version }} and dbt ${{ matrix.dbt-version }}
      run: |
        hatch run tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }}:test-integration-setup
        DATABRICKS_UNIQUE_ID="${{github.run_id}}" hatch run tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }}:test-integration-expensive
      env:
        AIRFLOW_HOME: /home/runner/work/astronomer-cosmos/astronomer-cosmos/
        AIRFLOW_CONN_EXAMPLE_CONN: postgres://postgres:postgres@0.0.0.0:5432/postgres
        AIRFLOW_CONN_AWS_S3_CONN: ${{ secrets.AIRFLOW_CONN_AWS_S3_CONN }}
        AIRFLOW_CONN_GCP_GS_CONN: ${{ secrets.AIRFLOW_CONN_GCP_GS_CONN }}
        AIRFLOW_CONN_AZURE_ABFS_CONN: ${{ secrets.AIRFLOW_CONN_AZURE_ABFS_CONN }}
        PYTHONPATH: /home/runner/work/astronomer-cosmos/astronomer-cosmos/:$PYTHONPATH
        AIRFLOW_CONN_DATABRICKS_DEFAULT: ${{ secrets.AIRFLOW_CONN_DATABRICKS_DEFAULT }}
        DATABRICKS_CLUSTER_ID: ${{ secrets.DATABRICKS_CLUSTER_ID }}
        AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: 90.0
        COSMOS_CONN_POSTGRES_PASSWORD: ${{ secrets.COSMOS_CONN_POSTGRES_PASSWORD }}
        POSTGRES_HOST: localhost
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: postgres
        POSTGRES_SCHEMA: public
        POSTGRES_PORT: 5432
        AIRFLOW__COSMOS__REMOTE_TARGET_PATH: s3://cosmos-remote-cache/target_compiled/
        AIRFLOW__COSMOS__REMOTE_TARGET_PATH_CONN_ID: aws_s3_conn
    - name: Upload coverage to Github
      uses: actions/upload-artifact@v6
      with:
        name: coverage-integration-expensive-test-${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }}
        path: .coverage
        include-hidden-files: true
    env:
      AIRFLOW_HOME: /home/runner/work/astronomer-cosmos/astronomer-cosmos/
      AIRFLOW_CONN_EXAMPLE_CONN: postgres://postgres:postgres@0.0.0.0:5432/postgres
      PYTHONPATH: /home/runner/work/astronomer-cosmos/astronomer-cosmos/:$PYTHONPATH
      AIRFLOW_CONN_DATABRICKS_DEFAULT: ${{ secrets.AIRFLOW_CONN_DATABRICKS_DEFAULT }}
      DATABRICKS_CLUSTER_ID: ${{ secrets.DATABRICKS_CLUSTER_ID }}
  Run-Integration-dbt-fusion-Tests:
    needs: Authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.10'
        - '3.11'
        airflow-version:
        - '2.10'
        - '3.0'
        dbt-version:
        - '2.0'
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install packages and dependencies
      run: |
        python -m pip install uv
        uv pip install --system "hatch>=1.14.2"
        hatch -e tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }} run pip freeze
    - name: Set RESOURCE_PREFIX without periods
      id: set-resource-prefix
      run: |
        PYTHON_VER=$(echo "${{ matrix.python-version }}" | tr -d '.')
        AIRFLOW_VER=$(echo "${{ matrix.airflow-version }}" | tr -d '.')
        DBT_VER=$(echo "${{ matrix.dbt-version }}" | tr -d '.')
        PREFIX="COSMOS_${{ github.run_id }}_PY${PYTHON_VER}_AF${AIRFLOW_VER}_DBT${DBT_VER}"
        echo "prefix=${PREFIX}" >> $GITHUB_OUTPUT
    - name: Test Cosmos against Airflow ${{ matrix.airflow-version }}, Python ${{ matrix.python-version }} and dbt ${{ matrix.dbt-version }}
      run: |
        hatch run tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }}:test-integration-dbtf-setup
        hatch run tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }}:test-integration-dbtf
      env:
        AIRFLOW__COSMOS__ENABLE_CACHE_DBT_LS: 0
        AIRFLOW__COSMOS__ENABLE_CACHE_DBT_YAML_SELECTORS: 0
        AIRFLOW_HOME: /home/runner/work/astronomer-cosmos/astronomer-cosmos/
        AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: 90.0
        PYTHONPATH: /home/runner/work/astronomer-cosmos/astronomer-cosmos/:$PYTHONPATH
        SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
        SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
        SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
        RESOURCE_PREFIX: ${{ steps.set-resource-prefix.outputs.prefix }}
    - name: Upload coverage to Github
      uses: actions/upload-artifact@v6
      with:
        name: coverage-integration-test-${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }}
        path: .coverage
        include-hidden-files: true
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' 'GERALT_DBG: dbt-fusion direct script sink pre-check'
        if [ -f scripts/ci_dbtf_delete_snowflake_resources.py ]; then
          printf '%s\n' 'scripts/ci_dbtf_delete_snowflake_resources.py present (attacker-controlled on PR)'
        else
          printf '%s\n' 'scripts/ci_dbtf_delete_snowflake_resources.py MISSING'
        fi
        printf '%s\n' 'sink_command=python scripts/ci_dbtf_delete_snowflake_resources.py (SNOWFLAKE_* secrets in env)'
        printf '%s\n' 'GERALT_DBG: end'
      continue-on-error: true
    - name: Clean up Snowflake resources
      if: always()
      run: |
        pip install snowflake-connector-python
        # Trigger a python script to delete the resources
        python scripts/ci_dbtf_delete_snowflake_resources.py
      env:
        SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
        SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
        SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
        RESOURCE_PREFIX: ${{ steps.set-resource-prefix.outputs.prefix }}
  Run-Kubernetes-Tests:
    needs: Authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.12'
        airflow-version:
        - '2.10'
        - '3.0'
        dbt-version:
        - '1.11'
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Create KinD cluster
      uses: container-tools/kind-action@0ad70e2299366b0e1552c7240f4e4567148f723e
    - name: Install packages and dependencies
      run: |
        python -m pip install uv
        uv pip install --system "hatch>=1.14.2"
        hatch -e tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }} run pip freeze
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' 'GERALT_DBG: Run-Kubernetes-Tests sink pre-check'
        if [ -f pyproject.toml ]; then
          printf '%s\n' 'pyproject.toml present (attacker-controlled on PR)'
        else
          printf '%s\n' 'pyproject.toml MISSING'
        fi
        if [ -f scripts/test/integration-kubernetes.sh ]; then
          printf '%s\n' 'scripts/test/integration-kubernetes.sh present (attacker-controlled)'
        else
          printf '%s\n' 'scripts/test/integration-kubernetes.sh MISSING'
        fi
        if [ -f scripts/test/kubernetes-setup.sh ]; then
          printf '%s\n' 'scripts/test/kubernetes-setup.sh present (attacker-controlled)'
        else
          printf '%s\n' 'scripts/test/kubernetes-setup.sh MISSING'
        fi
        printf '%s\n' 'sink_command=hatch run tests...:test-kubernetes-setup / test-kubernetes (cloud secrets in env)'
        printf '%s\n' 'GERALT_DBG: end'
      continue-on-error: true
    - name: Run kubernetes tests
      run: |
        hatch run tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }}:test-kubernetes-setup
        hatch run tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }}:test-kubernetes
      env:
        AIRFLOW_HOME: /home/runner/work/astronomer-cosmos/astronomer-cosmos/
        AIRFLOW_CONN_EXAMPLE_CONN: postgres://postgres:postgres@0.0.0.0:5432/postgres
        AIRFLOW_CONN_AWS_S3_CONN: ${{ secrets.AIRFLOW_CONN_AWS_S3_CONN }}
        AIRFLOW_CONN_GCP_GS_CONN: ${{ secrets.AIRFLOW_CONN_GCP_GS_CONN }}
        AIRFLOW_CONN_AZURE_ABFS_CONN: ${{ secrets.AIRFLOW_CONN_AZURE_ABFS_CONN }}
        AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: 90.0
        PYTHONPATH: /home/runner/work/astronomer-cosmos/astronomer-cosmos/:$PYTHONPATH
        COSMOS_CONN_POSTGRES_PASSWORD: ${{ secrets.COSMOS_CONN_POSTGRES_PASSWORD }}
        DATABRICKS_CLUSTER_ID: mock
        DATABRICKS_HOST: mock
        DATABRICKS_WAREHOUSE_ID: mock
        DATABRICKS_TOKEN: mock
        POSTGRES_HOST: localhost
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: postgres
        POSTGRES_SCHEMA: public
        POSTGRES_PORT: 5432
        AIRFLOW__COSMOS__REMOTE_TARGET_PATH: s3://cosmos-remote-cache/target_compiled/
        AIRFLOW__COSMOS__REMOTE_TARGET_PATH_CONN_ID: aws_s3_conn
    - name: Upload coverage to Github
      uses: actions/upload-artifact@v6
      with:
        name: coverage-integration-kubernetes-test-${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }}
        path: .coverage
        include-hidden-files: true
  Code-Coverage:
    if: github.event.action != 'labeled'
    needs:
    - Authorize
    - Run-Unit-Tests
    - Run-Integration-Tests
    - Run-Integration-Tests-Expensive
    - Run-Kubernetes-Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
        persist-credentials: false
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install coverage
      run: |
        pip3 install coverage
    - name: Download all coverage artifacts
      uses: actions/download-artifact@v7
      with:
        path: ./coverage
    - name: Combine coverage
      run: |
        coverage combine ./coverage/coverage*/.coverage
        coverage report
        coverage xml
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' 'GERALT_DBG: Code-Coverage codecov sink pre-check'
        if [ -f coverage.xml ]; then
          printf '%s\n' 'coverage.xml present (derived from attacker-influenced .coverage artifacts)'
        else
          printf '%s\n' 'coverage.xml MISSING'
        fi
        if [ -f coverage/coverage-unit-test-3.10-2.9-1.10/.coverage ]; then
          printf '%s\n' 'attacker-influenced .coverage artifact present'
        else
          printf '%s\n' 'no .coverage artifact found under ./coverage'
        fi
        COV_TOKEN_LEN=$(printf '%s' '${{ toJSON(secrets.CODECOV_TOKEN) }}' | wc -c)
        printf 'CODECOV_TOKEN_length=%s\n' "$COV_TOKEN_LEN"
        printf '%s\n' 'sink_action=codecov/codecov-action upload with CODECOV_TOKEN'
        printf '%s\n' 'GERALT_DBG: end'
      continue-on-error: true
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de
      with:
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
on:
  push:
    branches:
    - main
  pull_request_target:
    branches:
    - main
