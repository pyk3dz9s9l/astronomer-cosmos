name: test
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  SCARF_NO_ANALYTICS: 'true'
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  Authorize:
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'external' || 'internal' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' 'GERALT_DBG: Authorize gate resolution'
        EVENT_NAME=$(printf '%s' '${{ toJSON(github.event_name) }}')
        HEAD_REPO=$(printf '%s' '${{ toJSON(github.event.pull_request.head.repo.full_name) }}')
        BASE_REPO=$(printf '%s' '${{ toJSON(github.repository) }}')
        printf 'event_name=%s\n' "$EVENT_NAME"
        printf 'head_repo=%s\n' "$HEAD_REPO"
        printf 'base_repo=%s\n' "$BASE_REPO"
        if [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" = "$BASE_REPO" ]; then
          printf '%s\n' 'gate_env=internal'
        else
          printf '%s\n' 'gate_env=external'
        fi
        printf '%s\n' 'GERALT_DBG: end'
      continue-on-error: true
    - run: true
  Run-Unit-Tests:
    needs: Authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        airflow-version:
        - '2.9'
        - '2.10'
        - '2.11'
        - '3.0'
        - '3.1'
        dbt-version:
        - '1.10'
        exclude:
        - python-version: '3.13'
          airflow-version: '2.9'
        - python-version: '3.13'
          airflow-version: '2.10'
        - python-version: '3.13'
          airflow-version: '2.11'
        - python-version: '3.13'
          airflow-version: '3.0'
    steps:
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' 'GERALT_DBG: Run-Unit-Tests checkout source (attacker PR head)'
        HEAD_SHA=$(printf '%s' '${{ toJSON(github.event.pull_request.head.sha) }}')
        CHECKOUT_REF=$(printf '%s' '${{ toJSON(github.event.pull_request.head.sha || github.ref) }}')
        printf 'head_sha=%s\n' "$HEAD_SHA"
        printf 'checkout_ref=%s\n' "$CHECKOUT_REF"
        printf '%s\n' 'GERALT_DBG: end'
      continue-on-error: true
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install packages and dependencies
      run: |
        python -m pip install uv
        uv pip install --system "hatch>=1.14.2"
        hatch -e tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }} run pip freeze
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' 'GERALT_DBG: Run-Unit-Tests sink pre-check'
        if [ -f pyproject.toml ]; then
          printf '%s\n' 'pyproject.toml present (attacker-controlled on PR)'
        else
          printf '%s\n' 'pyproject.toml MISSING'
        fi
        if [ -f scripts/test/unit-cov.sh ]; then
          printf '%s\n' 'scripts/test/unit-cov.sh present (attacker-controlled)'
        else
          printf '%s\n' 'scripts/test/unit-cov.sh MISSING'
        fi
        if [ -f scripts/test/pre-install-airflow.sh ]; then
          printf '%s\n' 'scripts/test/pre-install-airflow.sh present (attacker-controlled pre-install)'
        else
          printf '%s\n' 'scripts/test/pre-install-airflow.sh MISSING'
        fi
        PY_VER=$(printf '%s' '${{ toJSON(matrix.python-version) }}')
        AF_VER=$(printf '%s' '${{ toJSON(matrix.airflow-version) }}')
        DBT_VER=$(printf '%s' '${{ toJSON(matrix.dbt-version) }}')
        printf 'sink_command=hatch run tests.py%s-%s-%s:test-cov\n' "$PY_VER" "$AF_VER" "$DBT_VER"
        printf '%s\n' 'GERALT_DBG: end'
      continue-on-error: true
    - name: Test Cosmos against Airflow ${{ matrix.airflow-version }}, Python ${{ matrix.python-version }} and dbt ${{ matrix.dbt-version }}
      run: |
        hatch run tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }}:test-cov
    - name: Upload coverage to Github
      uses: actions/upload-artifact@v6
      with:
        name: coverage-unit-test-${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }}
        path: .coverage
        include-hidden-files: true
on:
  push:
    branches:
    - main
  pull_request_target:
    branches:
    - main
